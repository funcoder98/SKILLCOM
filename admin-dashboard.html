<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>(function(){try{document.documentElement.setAttribute("data-theme", localStorage.getItem("skillcom-theme")||"dark");}catch(e){}})();</script>
    <title>Skillcom - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 2rem;">
            <h1 style="color: var(--accent-primary);">ADMIN DASHBOARD</h1>
            <button class="btn btn-outline btn-small" onclick="logout()">Log out</button>
        </header>

        <div class="meetings-tabs">
            <button class="meetings-tab active" data-tab="members">👥 Members</button>
            <button class="meetings-tab" data-tab="recent">🆕 New Logins</button>
            <button class="meetings-tab" data-tab="all">📜 All Logins</button>
        </div>

        <div id="adminContent">
            <p style="color: var(--text-muted);">Loading...</p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app-ui.js"></script>
    <script>
        const token = requireAuth();
        let activeTab = "members";
        let membersCache = null;

        function fmtDate(iso) {
            if (!iso) return "-";
            return new Date(iso).toLocaleString();
        }

        function renderMembers(members) {
            const content = document.getElementById('adminContent');
            if (members.length === 0) {
                content.innerHTML = "<p style='color:var(--text-muted);'>No members yet.</p>";
                return;
            }

            content.innerHTML = members.map(m => `
                <div class="meeting-item">
                    <div>
                        <strong>${m.name}</strong> <span style="color:var(--text-muted); font-family:monospace; font-size:0.8rem;">@${m.username}</span>
                        <div class="meeting-meta">
                            ${m.email || 'No email on file'} · ${m.role} · joined ${fmtDate(m.created_at)}
                        </div>
                        <div class="meeting-meta">
                            Teaches: ${m.skills_offered.join(', ') || '—'} &nbsp;|&nbsp; ${m.reputation_token_count} token${m.reputation_token_count === 1 ? '' : 's'}
                        </div>
                    </div>
                    <div style="display:flex; align-items:center; gap:0.75rem;">
                        <span class="status-badge ${m.is_active ? 'confirmed' : ''}" style="${!m.is_active ? 'border-color: var(--danger); color: var(--danger); background: rgba(248,113,113,0.1);' : ''}">
                            ${m.is_active ? 'ACTIVE' : 'REJECTED'}
                        </span>
                        ${m.role === 'admin'
                            ? ''
                            : m.is_active
                                ? `<button class="btn btn-outline btn-small" onclick="rejectMember('${m.id}')">Reject</button>`
                                : `<button class="btn btn-secondary btn-small" onclick="reinstateMember('${m.id}')">Reinstate</button>`
                        }
                    </div>
                </div>
            `).join("");
        }

        function renderLogins(logins, emptyText) {
            const content = document.getElementById('adminContent');
            if (logins.length === 0) {
                content.innerHTML = `<p style="color:var(--text-muted);">${emptyText}</p>`;
                return;
            }
            content.innerHTML = logins.map(l => `
                <div class="meeting-item">
                    <div>
                        <strong>@${l.username}</strong>
                        <div class="meeting-meta">${l.role}</div>
                    </div>
                    <div class="meeting-meta">${fmtDate(l.logged_in_at)}</div>
                </div>
            `).join("");
        }

        async function loadTab() {
            const content = document.getElementById('adminContent');
            content.innerHTML = "<p style='color:var(--text-muted);'>Loading...</p>";

            try {
                if (activeTab === "members") {
                    const res = await fetch(`${API_BASE}/api/admin/members`, { headers: authHeaders() });
                    if (!checkAdminAuth(res)) return;
                    const data = await res.json();
                    membersCache = data.members;
                    renderMembers(data.members);
                } else {
                    const scope = activeTab === "recent" ? "recent" : "all";
                    const res = await fetch(`${API_BASE}/api/admin/logins?scope=${scope}`, { headers: authHeaders() });
                    if (!checkAdminAuth(res)) return;
                    const data = await res.json();
                    renderLogins(data.logins, scope === "recent" ? "No logins in the last 24 hours." : "No login history yet.");
                }
            } catch (err) {
                content.innerHTML = "<p class='error-text'>Cannot reach the Skillcom server. Is main.py running?</p>";
            }
        }

        function checkAdminAuth(res) {
            if (res.status === 401) { logout(); return false; }
            if (res.status === 403) {
                alert("Admin access required.");
                window.location.href = "home.html";
                return false;
            }
            return true;
        }

        async function rejectMember(id) {
            if (!confirm("Suspend this member's account? They won't be able to log in until reinstated.")) return;
            const res = await fetch(`${API_BASE}/api/admin/members/${id}/reject`, { method: "POST", headers: authHeaders() });
            if (res.ok) loadTab();
        }

        async function reinstateMember(id) {
            const res = await fetch(`${API_BASE}/api/admin/members/${id}/reinstate`, { method: "POST", headers: authHeaders() });
            if (res.ok) loadTab();
        }

        document.querySelectorAll('.meetings-tab').forEach(tabBtn => {
            tabBtn.addEventListener('click', () => {
                document.querySelectorAll('.meetings-tab').forEach(b => b.classList.remove('active'));
                tabBtn.classList.add('active');
                activeTab = tabBtn.dataset.tab;
                loadTab();
            });
        });

        window.onload = () => {
            const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
            if (currentUser.role !== 'admin') {
                window.location.href = "home.html";
                return;
            }
            loadTab();
        };
    </script>
</body>
</html>
