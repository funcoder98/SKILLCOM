<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>(function(){try{document.documentElement.setAttribute("data-theme", localStorage.getItem("skillcom-theme")||"dark");}catch(e){}})();</script>
    <title>Skillcom - Reset Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="justify-content: center; align-items: center;">

    <div class="card" style="text-align: center; max-width: 400px; width: 90%;">
        <h1 style="color: var(--accent-primary); letter-spacing: 2px;">SKILLCOM</h1>
        <p style="color: var(--text-muted); margin: 1rem 0 2rem;">Choose a new password</p>

        <form id="resetForm" style="text-align: left;">
            <label>New Password</label>
            <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters">

            <label>Confirm New Password</label>
            <input type="password" id="confirmPassword" required minlength="6" placeholder="Retype your new password">

            <p class="error-text" id="errorMsg"></p>

            <button type="submit" class="btn">Reset Password</button>
        </form>

        <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);" id="noTokenNote"></p>
    </div>

    <script src="config.js"></script>
    <script src="app-ui.js"></script>
    <script>
        const token = new URLSearchParams(window.location.search).get('token');

        if (!token) {
            document.getElementById('resetForm').style.display = 'none';
            document.getElementById('noTokenNote').innerHTML =
                'This reset link is missing its token. <a href="forgot-password.html" style="color: var(--accent-secondary);">Request a new one</a>.';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = "";

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                errorMsg.innerText = "Passwords don't match.";
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/password-reset/confirm`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, new_password: newPassword })
                });
                const data = await res.json();

                if (!res.ok) {
                    errorMsg.innerText = data.detail || "Could not reset your password.";
                    return;
                }

                window.location.href = "login.html";
            } catch (err) {
                errorMsg.innerText = "Cannot reach the Skillcom server. Is main.py running?";
            }
        });
    </script>
</body>
</html>
