<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>(function(){try{document.documentElement.setAttribute("data-theme", localStorage.getItem("skillcom-theme")||"dark");}catch(e){}})();</script>
    <title>Skillcom - Log In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="justify-content: center; align-items: center;">

    <div class="card" style="text-align: center; max-width: 400px; width: 90%;">
        <h1 style="color: var(--accent-primary); letter-spacing: 2px;">SKILLCOM</h1>
        <p style="color: var(--text-muted); margin: 1rem 0 2rem;">The AI-Powered Peer Learning Network</p>

        <form id="loginForm" style="text-align: left;">
            <label>Username</label>
            <input type="text" id="username" required autocomplete="username" placeholder="e.g., jane_doe">

            <label>Password</label>
            <input type="password" id="password" required autocomplete="current-password" placeholder="Your password">

            <p class="error-text" id="errorMsg"></p>

            <button type="submit" class="btn">Log In</button>
        </form>

        <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            New here? <a href="register.html" style="color: var(--accent-secondary);">Create a profile</a>
        </p>
        <p style="margin-top: 0.5rem; font-size: 0.85rem; color: var(--text-muted);">
            <a href="forgot-password.html" style="color: var(--accent-secondary);">Forgot your password?</a>
        </p>
    </div>

    <script src="config.js"></script>
    <script src="app-ui.js"></script>
    <script>
        // If already logged in, skip straight to the right dashboard.
        if (localStorage.getItem('authToken')) {
            const existingUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
            window.location.href = existingUser.role === "admin" ? "admin-dashboard.html" : "home.html";
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = "";

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_BASE}/api/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    errorMsg.innerText = data.detail || "Login failed.";
                    return;
                }

                localStorage.setItem('authToken', data.access_token);
                localStorage.setItem('currentUser', JSON.stringify(data.user));
                window.location.href = data.user.role === "admin" ? "admin-dashboard.html" : "home.html";
            } catch (err) {
                errorMsg.innerText = "Cannot reach the Skillcom server. Is main.py running?";
            }
        });
    </script>
</body>
</html>
