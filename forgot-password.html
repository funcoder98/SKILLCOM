<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>(function(){try{document.documentElement.setAttribute("data-theme", localStorage.getItem("skillcom-theme")||"dark");}catch(e){}})();</script>
    <title>Skillcom - Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="justify-content: center; align-items: center;">

    <div class="card" style="text-align: center; max-width: 400px; width: 90%;">
        <h1 style="color: var(--accent-primary); letter-spacing: 2px;">SKILLCOM</h1>
        <p style="color: var(--text-muted); margin: 1rem 0 2rem;">Reset your password</p>

        <form id="forgotForm" style="text-align: left;">
            <label>Email</label>
            <input type="email" id="email" required placeholder="The email you registered with">

            <p class="error-text" id="errorMsg"></p>
            <p id="successMsg" style="color: var(--success); font-size: 0.85rem; margin-top: -1rem; margin-bottom: 1rem; display:none;"></p>

            <button type="submit" class="btn">Send Reset Link</button>
        </form>

        <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            <a href="login.html" style="color: var(--accent-secondary);">← Back to log in</a>
        </p>
    </div>

    <script src="config.js"></script>
    <script src="app-ui.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            errorMsg.innerText = "";
            successMsg.style.display = "none";

            const email = document.getElementById('email').value.trim();

            try {
                const res = await fetch(`${API_BASE}/api/password-reset/request`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (!res.ok) {
                    errorMsg.innerText = data.detail || "Something went wrong.";
                    return;
                }

                document.getElementById('forgotForm').querySelector('button').disabled = true;
                successMsg.innerText = data.message;
                successMsg.style.display = "block";
            } catch (err) {
                errorMsg.innerText = "Cannot reach the Skillcom server. Is main.py running?";
            }
        });
    </script>
</body>
</html>
